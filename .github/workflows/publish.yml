# Publishes to npm when a version tag (v1.2.3) is pushed.
# Publishes as npm user nex8n via the NPM_TOKEN secret. --provenance attaches a
# signed statement linking the package to this exact commit (needs id-token: write).
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: tools/check-tarball.sh
      - name: Pick the npm dist-tag from the git tag
        id: disttag
        run: |
          tag="$(tools/npm-dist-tag.sh "${GITHUB_REF_NAME}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
